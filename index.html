
<header>
  <div class="container">
    <!-- Top brand row (company only — LOGO REMOVED) -->
    <div class="hdr">
      <div class="brandmark">
        <div class="titlewrap">
          <div class="brand-title">Centiwise</div>
          <div class="brand-sub">Secure Global Payments</div>
        </div>
      </div>
      <div class="sub">Nairobi • <span id="todayStr"></span></div>
    </div>

    <!-- Centered product row -->
    <div class="product-row">
      <div class="product-block">
        <div class="product-title">Room Booking Manager</div>
        <div class="product-sub">Manage room bookings efficiently</div>
      </div>
    </div>

    <!-- Summary strip (kept inside header) -->
    <div class="summary">
      <div class="tile">
        <div>
          <div class="lbl">Rooms available now (selected time)</div>
          <div class="kpi" id="kpiAvail">–</div>
        </div>
        <div class="pill">Availability</div>
      </div>
      <div class="tile">
        <div>
          <div class="lbl">Bookings on selected date</div>
          <div class="kpi" id="kpiBookings">–</div>
        </div>
        <div class="pill">Daily load</div>
      </div>
      <div class="tile">
        <div>
          <div class="lbl">Conflicts prevented</div>
          <div class="kpi" id="kpiConflicts">0</div>
        </div>
        <div class="pill">Quality</div>
      </div>
    </div>
  </div>
</header>
