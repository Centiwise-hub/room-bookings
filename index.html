
<main class="container">
  <div class="grid">

    <!-- LEFT SIDE -->
    <section class="card">
      <h2>Create Booking</h2>

      <div class="row">
        <div style="flex:1">
          <label for="room">Room</label>
          <select id="room"></select>
        </div>
        <div style="flex:1">
          <label for="meetingType">Meeting type</label>
          <select id="meetingType"></select>
        </div>
      </div>

      <div class="row">
        <div class="inline">
          <div>
            <label for="date">Date</label>
            <input type="date" id="date"/>
          </div>
          <div>
            <label for="start">Start</label>
            <input type="time" id="start" value="09:00"/>
          </div>
          <div>
            <label for="end">End</label>
            <input type="time" id="end" value="10:00"/>
          </div>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="title">Title / Purpose</label>
          <input type="text" id="title" placeholder="e.g., Management sync, HR interview"/>
        </div>
      </div>

      <div class="row">
        <div class="inline">
          <div>
            <label for="organizer">Organizer</label>
            <input type="text" id="organizer" placeholder="Your name"/>
          </div>
          <div>
            <label for="attendees">Attendees (comma-separated)</label>
            <input type="text" id="attendees" placeholder="alice@org.com, bob@org.com"/>
          </div>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="notes">Notes (optional)</label>
          <textarea id="notes" rows="2" placeholder="Any additional information…"></textarea>
        </div>
      </div>

      <div class="footer">
        <button id="createBtn">Create Booking</button>
      </div>

      <div class="divider"></div>

      <h2>Availability (for selected date & time)</h2>

      <div class="row">
        <div class="inline">
          <div>
            <label for="equipFilter">Equipment</label>
            <select id="equipFilter">
              <option value="">Any</option>
              <option value="Large TV Screen">Large TV Screen</option>
            </select>
          </div>
          <div>
            <label for="capacityFilter">Min capacity</label>
            <select id="capacityFilter">
              <option value="0">Any</option>
              <option value="1">1+</option>
              <option value="4">4+</option>
              <option value="8">8+</option>
              <option value="12">12+</option>
            </select>
          </div>
        </div>
      </div>

      <div id="availability"></div>
      <div class="hint">Click a room above to select it or press “Book” to prefill the form.</div>

      <div class="divider"></div>

      <h2>Day Schedule (by room)</h2>
      <div class="sched" id="daySchedule"></div>
    </section>

    <!-- RIGHT SIDE -->
    <section class="card">
      <div class="inline" style="align-items:center; margin-bottom:10px">
        <h2 style="margin:0">Bookings</h2>
        <span class="badge" id="countBadge">0</span>
      </div>

      <div class="searchbar" style="margin-bottom:8px; display:flex; gap:8px; align-items:center;">
        <input id="searchText" type="search" placeholder="Search title, organizer, attendees…"/>
        <button class="btn-ghost" id="clearSearch">Clear</button>
      </div>

      <h3 style="margin:0 0 8px 0; font-size:14px; color:#0a8f7e">Filters</h3>

      <div class="row">
        <div class="inline">
          <div>
            <label for="filterRoom">Room</label>
            <select id="filterRoom"></select>
          </div>
          <div>
            <label for="filterDate">Date</label>
            <input type="date" id="filterDate"/>
          </div>
        </div>
      </div>

      <div class="footer" style="margin-top:6px; display:flex; gap:8px; justify-content:flex-end;">
        <button class="btn-ghost" id="resetFilters">Reset Filters</button>
        <button class="btn-ghost" id="exportBtn">Export JSON</button>
        <input type="file" id="importInput" accept="application/json" style="display:none"/>
        <button class="btn-ghost" id="importBtn">Import JSON</button>
        <button class="btn-danger" id="clearAll">Clear All Bookings</button>
      </div>

      <div class="divider"></div>
      <div class="list" id="list"></div>

    </section>

  </div>
</main>

<script>
/* ===== STATE & UTILITIES ===== */

const DEFAULT_ROOMS = [
  { id:"Tembo_Boardroom", name:"Tembo_Boardroom", capacity:15, equipment:["Large TV Screen"] },
  { id:"Kifaru", name:"Kifaru", capacity:4, equipment:["Large TV Screen"] },
  { id:"Nyati", name:"Nyati", capacity:4, equipment:[] },
  { id:"Simba", name:"Simba", capacity:1, equipment:[] },
  { id:"Chui", name:"Chui", capacity:1, equipment:[] },
];

const MEETING_TYPES = [
  "Management Meeting",
  "HR Interview",
  "Departmental Meeting",
  "Teams call"
];

const byId = (id)=>document.getElementById(id);
const storageKey = "roomBookingData.v3";

function dateISO(d){return new Date(d).toISOString().slice(0,10);}
function timeToMinutes(t){const [h,m]=t.split(":").map(Number);return h*60+m;}
function overlaps(aStart,aEnd,bStart,bEnd){return aStart < bEnd && bStart < aEnd;}

function loadData(){
  try{
    const raw = localStorage.getItem(storageKey);
    return raw ? JSON.parse(raw) : {rooms:DEFAULT_ROOMS, bookings:[], conflictCount:0};
  }catch(e){
    return {rooms:DEFAULT_ROOMS, bookings:[], conflictCount:0};
  }
}

function saveData(data){
  localStorage.setItem(storageKey, JSON.stringify(data));
}

let state = loadData();
